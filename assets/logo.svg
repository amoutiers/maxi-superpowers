<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shield-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="60%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#1a2640"/>
    </linearGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="metal-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Lightning / Fire Gradient -->
    <linearGradient id="amber-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Text Brand Gradient -->
    <linearGradient id="text-brand-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Gradients for Circular Nodes (Thermal Execution) -->
    <linearGradient id="spec-dot-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="plan-dot-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="build-dot-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ship-dot-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Drop Shadow for Shield -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip-shield-frame">
      <rect width="800" height="200" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip-shield-frame)">
    <!-- Background -->
    <rect width="800" height="200" fill="url(#shield-bg)"/>

    <!-- Subtle circuit track background details -->
    <path d="M -50,100 Q 150,150 350,100 T 750,100" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="10,5" opacity="0.4"/>
    <path d="M 50,50 Q 250,-10 450,50 T 850,50" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="10,5" opacity="0.4"/>

    <!-- Left Accent Side Bar (representing Gating) -->
    <rect x="0" y="0" width="6" height="200" fill="url(#metal-grad)"/>

    <!-- Icon: Modern Shield Crest + Lightning M -->
    <g transform="translate(45, 38)" filter="url(#shadow)">
      <!-- Outer Shield Crest -->
      <path d="M 10,15 Q 55,5 100,15 Q 100,65 55,110 Q 10,65 10,15 Z" 
            fill="#131e35" stroke="url(#metal-grad)" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Inner Shield Accent Line -->
      <path d="M 18,22 Q 55,14 92,22 Q 92,60 55,98 Q 18,60 18,22 Z" 
            fill="none" stroke="#1e293b" stroke-width="1" opacity="0.8"/>

      <!-- Stylized Bold M + Bolt -->
      <!-- Lightning bolt that splits the M -->
      <path d="M 32,32 L 46,32 L 38,55 L 52,55 L 34,88 L 44,59 L 32,59 Z" 
            fill="url(#amber-grad)" filter="url(#glow-gold)"/>

      <!-- The 'M' Wings of the Shield -->
      <path d="M 23,30 L 33,30 L 40,50 L 30,75 Z" fill="#6366f1" opacity="0.75"/>
      <path d="M 87,30 L 77,30 L 70,50 L 80,75 Z" fill="#6366f1" opacity="0.75"/>
      <path d="M 58,32 L 72,32 L 64,55 L 78,55 L 60,88 L 70,59 L 58,59 Z" 
            fill="url(#amber-grad)" filter="url(#glow-gold)"/>
    </g>

    <!-- Brand Typography -->
    <!-- "maxi" Title -->
    <text x="180" y="94"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="56" font-weight="800" fill="#ffffff"
          letter-spacing="-1.5">maxi</text>

    <!-- "superpowers" Title (with gradient and modern tracking) -->
    <text x="306" y="94"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="56" font-weight="300" fill="url(#text-brand-grad)"
          letter-spacing="-1">superpowers</text>

    <!-- Tagline (With bullet-points of core pipeline gating features) -->
    <g transform="translate(182, 114)">
      <!-- Mini check indicators -->
      <circle cx="5" cy="18" r="3" fill="#f59e0b" filter="url(#glow-gold)"/>
      <text x="15" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Constitution Enforced</text>

      <circle cx="160" cy="18" r="3" fill="#6366f1"/>
      <text x="170" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Phase-Gated Gating</text>

      <circle cx="305" cy="18" r="3" fill="#3b82f6"/>
      <text x="315" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">ADR-Backed Actions</text>
    </g>

    <!-- Small footer description -->
    <text x="182" y="162" font-family="ui-monospace, 'SF Mono', monospace" font-size="9" fill="#475569">
      $ claude plugin install maxi-superpowers --stage strict
    </text>

    <!-- Flow Diagram: Curved connectors and nodes (Right Side) -->
    <g transform="translate(620, 45)">
      <!-- Circular Ring representing full lifecycle loop -->
      <circle cx="65" cy="55" r="42" fill="none" stroke="#1e293b" stroke-width="4"/>
      <path d="M 65,13 A 42,42 0 0,1 107,55 A 42,42 0 0,1 65,97" fill="none" stroke="url(#metal-grad)" stroke-width="4" stroke-linecap="round"/>

      <!-- Circular nodes representing gating checkpoints -->
      <circle cx="65" cy="13" r="6" fill="url(#spec-dot-grad)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="65" y="5" font-family="ui-monospace, 'SF Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="middle" font-weight="bold">SPEC</text>

      <circle cx="107" cy="55" r="6" fill="url(#plan-dot-grad)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="120" y="58" font-family="ui-monospace, 'SF Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="start" font-weight="bold">PLAN</text>

      <circle cx="65" cy="97" r="6" fill="url(#build-dot-grad)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="65" y="112" font-family="ui-monospace, 'SF Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="middle" font-weight="bold">BUILD</text>

      <circle cx="23" cy="55" r="6" fill="url(#ship-dot-grad)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="10" y="58" font-family="ui-monospace, 'SF Mono', monospace" font-size="8" fill="#475569" text-anchor="end" font-weight="bold">SHIP</text>

      <!-- Center Logo/Icon representation -->
      <polygon points="65,40 73,53 66,53 71,68 59,57 66,57" fill="#ffffff" opacity="0.9"/>
    </g>

  </g>

  <!-- Outer frame border -->
  <rect width="800" height="200" rx="14" fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>
